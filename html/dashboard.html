<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Tiendita</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/dashboard-custom.css" />
</head>
<body>

<div class="app-layout">
    <!-- Menú lateral -->
    <div id="menu-container"></div>

    <!-- Contenido principal -->
    <div class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <input type="text" placeholder="🔍 Buscar ventas, productos..." />
            <div class="user"><i class="fas fa-user-circle" style="margin-right:8px;"></i>Administrador</div>
        </header>

        <!-- CONTENIDO DASHBOARD -->
        <main class="contenido">
            <h1 class="dashboard-title">📊 Panel de control</h1>
            <p class="dashboard-subtitle">Resumen general de tu tienda hoy</p>

            <!-- MÉTRICAS -->
            <div class="metricas-grid" id="metricas-grid">
                <!-- Las métricas se cargan con JavaScript -->
            </div>

            <!-- FILA: VENTAS RECIENTES + POPULARES -->
            <div class="dashboard-row">
                <!-- Ventas recientes -->
                <div class="card-panel">
                    <h3 class="card-title">
                        📋 Últimas ventas
                        <a href="#" class="card-link" id="ver-todas-ventas">Ver todas →</a>
                    </h3>
                    <table class="tabla-resumen" id="tabla-ventas-recientes">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="ventas-recientes-body">
                            <tr><td colspan="3" class="loading-text">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Productos más vendidos -->
                <div class="card-panel">
                    <h3 class="card-title">
                        🔥 Más vendidos
                        <a href="#" class="card-link" id="ver-todos-productos">Ver todos →</a>
                    </h3>
                    <div id="populares-lista">
                        <div class="loading-text">Cargando...</div>
                    </div>
                </div>
            </div>

            <!-- FILA: STOCK CRÍTICO -->
            <div class="stock-critico-container">
                <div class="card-panel">
                    <h3 class="card-title">⚠️ Productos con stock crítico</h3>
                    <div id="stock-critico-lista">
                        <div class="empty-text">No hay productos con stock bajo</div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="../javascript/menu.js"></script>
<script src="../javascript/dashboard.js"></script>

</body>
</html>
