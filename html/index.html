<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Promesas de Vida</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="login-wrapper">
    <div class="login-container">
        <!-- Panel izquierdo - Formulario -->
        <div class="login-form-panel">
            <div class="form-header">
                <div class="brand-icon">
                    <i class="fas fa-store-alt"></i>
                </div>
                <h1>Bienvenido</h1>
                <p>Inicia sesión para administrar tu tienda</p>
            </div>

            <form id="loginForm" class="login-form-fields">
                <div class="input-group">
                    <label>
                        <i class="fas fa-user"></i>
                        Usuario
                    </label>
                    <input type="text" placeholder="Ingresa tu usuario" id="username" required />
                </div>

                <div class="input-group">
                    <label>
                        <i class="fas fa-envelope"></i>
                        Correo electrónico
                    </label>
                    <input type="email" placeholder="ejemplo@correo.com" id="email" required />
                </div>

                <div class="input-group">
                    <label>
                        <i class="fas fa-lock"></i>
                        Contraseña
                    </label>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Ingresa tu contraseña" id="password" required />
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked />
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>

                <div class="register-link">
                    ¿No tienes una cuenta? <a href="#">Regístrate aquí</a>
                </div>
            </form>
        </div>

        <!-- Panel derecho - Branding -->
        <div class="login-brand-panel">
            <div class="brand-content">
                <div class="brand-logo">
                    <img src="../documentos/foto_promesasDeVida.png" alt="Promesas de Vida" />
                </div>
                <h2>Promesas de Vida</h2>
                <p class="brand-subtitle">Sistema de gestión para tu negocio</p>
                
                <div class="brand-features">
                    <div class="feature">
                        <i class="fas fa-chart-line"></i>
                        <span>Ventas en tiempo real</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-boxes"></i>
                        <span>Control de inventario</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-users"></i>
                        <span>Gestión de clientes</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-file-invoice-dollar"></i>
                        <span>Reportes financieros</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================
    // REDIRECCIÓN AUTOMÁTICA SI YA ESTÁ LOGUEADO
    // ============================================
    
    // Verificar si el usuario ya está autenticado
    document.addEventListener('DOMContentLoaded', function() {
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const userData = localStorage.getItem('userData');
        
        if (isLoggedIn && userData) {
            // Si ya está logueado, redirigir al dashboard
            window.location.href = 'dashboard.html';
        }
    });

    // ============================================
    // MANEJAR EL LOGIN
    // ============================================
    
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });

    // Manejar el envío del formulario
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Obtener valores
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const rememberMe = document.getElementById('rememberMe').checked;
        
        // Validación básica
        if (!username || !email || !password) {
            alert('⚠️ Por favor, completa todos los campos.');
            return;
        }
        
        // Validar formato de email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert('⚠️ Por favor, ingresa un correo electrónico válido.');
            return;
        }
        
        // Aquí iría tu autenticación real con el backend
        // Por ahora, simulamos un login exitoso
        
        // Guardar datos del usuario (simulado)
        const userData = {
            username: username,
            email: email,
            loginTime: new Date().toISOString(),
            rememberMe: rememberMe
        };
        
        // Guardar en localStorage
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userData', JSON.stringify(userData));
        
        if (rememberMe) {
            localStorage.setItem('rememberMe', 'true');
        }
        
        // Mostrar mensaje de éxito
        alert('✅ ¡Bienvenido, ' + username + '! Redirigiendo al dashboard...');
        
        // Redirigir al dashboard
        window.location.href = 'dashboard.html';
    });

    // ============================================
    // AUTO-COMPLETAR (OPCIONAL - SOLO PARA PRUEBAS)
    // ============================================
    
    // Si estás en modo desarrollo, puedes auto-completar el formulario
    const isDevelopment = true; // Cambia a false en producción
    if (isDevelopment) {
        document.addEventListener('DOMContentLoaded', function() {
            // Solo auto-completar si no hay datos guardados
            if (!localStorage.getItem('userData')) {
                document.getElementById('username').value = 'admin';
                document.getElementById('email').value = 'admin@tiendita.com';
                document.getElementById('password').value = 'admin123';
            }
        });
    }

    // ============================================
    // MANEJO DE CIERRE DE SESIÓN (OPCIONAL)
    // ============================================
    
    // Función para cerrar sesión (puedes llamarla desde el dashboard)
    window.logout = function() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userData');
        if (!localStorage.getItem('rememberMe')) {
            localStorage.removeItem('rememberMe');
        }
        window.location.href = 'index.html';
    };
</script>

</body>
</html>
