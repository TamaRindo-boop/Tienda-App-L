<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="inventario.css">
</head>
<body>

    <!-- MENÚ (mismo que en productos.html) -->
    <div id="menu-container"></div>

    <!-- MODAL NUEVO MOVIMIENTO -->
    <div id="modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center;">
        <div style="background:white;padding:25px;border-radius:16px;width:400px;max-width:90%;">
            <h2 id="modalTitulo" style="margin-bottom:15px;">Nuevo Movimiento</h2>

            <label>📦 Producto</label><br>
            <input type="text" id="producto" placeholder="Ej: Sabritas, Galletas..." style="width:100%;margin-bottom:12px;padding:8px;border:1px solid #ddd;border-radius:6px;"><br>

            <label>🔄 Tipo de Movimiento</label><br>
            <select id="tipo" style="width:100%;margin-bottom:12px;padding:8px;border:1px solid #ddd;border-radius:6px;">
                <option value="Entrada">📥 Entrada (ingresa stock)</option>
                <option value="Salida">📤 Salida (reduce stock)</option>
                <option value="Ajuste">⚙️ Ajuste (corrección)</option>
            </select><br>

            <label>🔢 Cantidad</label><br>
            <input type="number" id="cantidad" placeholder="Ej: 10, 5, 25..." min="1" style="width:100%;margin-bottom:12px;padding:8px;border:1px solid #ddd;border-radius:6px;"><br>

            <label>🏷️ Referencia / Lote</label><br>
            <input type="text" id="referencia" placeholder="Ej: REF-001, LOT-2024..." style="width:100%;margin-bottom:20px;padding:8px;border:1px solid #ddd;border-radius:6px;"><br>

            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button onclick="cerrarModal()" style="padding:8px 16px;cursor:pointer;border:1px solid #ccc;background:white;border-radius:6px;">Cancelar</button>
                <button onclick="guardarMovimiento()" style="padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;">Guardar</button>
            </div>
        </div>
    </div>

    <!-- BARRA SUPERIOR -->
    <header class="topbar">
        <input type="text" id="buscarMovimiento" placeholder="Buscar movimientos...">
        <div class="user">Administrador</div>
    </header>

    <!-- CONTENIDO -->
    <main class="contenido">
        <div class="inventario-header">
            <div>
                <h1>📦 Inventario</h1>
                <p>Controla entradas, salidas y ajustes de productos</p>
            </div>
            <button class="btn-nuevo" onclick="abrirModal()">
                <i class="fas fa-plus"></i> Nuevo Movimiento
            </button>
        </div>

        <div class="filtros">
            <button onclick="filtrar('Todos', this)" class="activo">📋 Todos</button>
            <button onclick="filtrar('Entrada', this)">📥 Entradas</button>
            <button onclick="filtrar('Salida', this)">📤 Salidas</button>
            <button onclick="filtrar('Ajuste', this)">⚙️ Ajustes</button>
        </div>

        <div class="tabla-container">
            <table class="tabla-productos">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Producto</th>
                        <th>Referencia</th>
                        <th>Cantidad</th>
                        <th>Usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMovimientos">
                    <tr>
                        <td colspan="7" style="text-align:center;padding:30px;color:#94a3b8;">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="inventario.js"></script>
    <script>
        // Cargar el menú dinámicamente (igual que en productos.html)
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                // Marcar el enlace activo
                const links = document.querySelectorAll('#menu-container a');
                links.forEach(link => {
                    if (link.getAttribute('href') === 'inventario.html') {
                        link.classList.add('active');
                    }
                });
            })
            .catch(error => console.error('Error cargando el menú:', error));
    </script>

</body>
</html>
